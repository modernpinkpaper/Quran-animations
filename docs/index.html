<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Arabic</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#a06cc8"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fbf6ff;--card:#fff;--ink:#2a2147;--mut:#6a5a8a;--pur:#a06cc8;--pink:#ff6f9f;--ok:#2fa36b;--mid:#e0a020;--bad:#e0555f;--line:#eadff2}
@media (prefers-color-scheme:dark){:root{--bg:#1d1730;--card:#2a2147;--ink:#f5efff;--mut:#bdb0d6;--line:#3d3360}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px;max-width:560px;margin:auto}
h1{font-size:26px;margin:22px 0 4px}h2{font-size:19px;margin:26px 0 8px;color:var(--pur)}p{margin:6px 0}.mut{color:var(--mut);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--pur);color:#fff;font-weight:700;cursor:pointer}button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}button:disabled{opacity:.5}
.lesson{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--line);margin:8px 0}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:center;font-size:40px;line-height:1.9;margin:6px 0}
.big{font-size:50px;font-weight:800;text-align:center;margin:4px 0}.chips{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center;margin:10px 0}
.chip{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:26px;padding:4px 12px;border-radius:12px;border:2px solid}.chip small{display:block;font:13px system-ui;direction:ltr;text-align:center}
.good{border-color:var(--ok);background:rgba(47,163,107,.13)}.close{border-color:var(--mid);background:rgba(224,160,32,.15)}.missing{border-color:var(--bad);background:rgba(224,85,95,.13)}
.rec{background:var(--pink);font-size:19px;width:100%;padding:16px}.rec.on{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
.back{background:none;color:var(--pur);padding:14px 0;border:0}.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pur)}
select,input[type=range]{font:inherit;width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}label{display:block;margin:10px 0 4px;font-weight:700}
.words{display:flex;flex-wrap:wrap;gap:10px;direction:rtl;justify-content:center;margin:8px 0}.w{text-align:center;padding:4px 10px;border-radius:14px;border:2px solid transparent;transition:background .15s,border-color .15s}.wa{display:block;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:36px;line-height:1.7}.wt{display:block;direction:ltr;font-size:15px;color:var(--mut);font-weight:600}.w.now{background:rgba(255,111,159,.22);border-color:var(--pink)}.w.done{background:rgba(47,163,107,.15);border-color:var(--ok)}.w.done .wt,.w.now .wt{color:var(--ink)}
.note{font-size:14px;color:var(--mut);border-left:4px solid var(--line);padding-left:10px;margin:12px 0}
</style></head><body><div id="app"></div><script type="module" src="app.js"></script></body></html>
